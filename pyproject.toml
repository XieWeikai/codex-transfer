[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session-manager"
version = "0.1.0"
description = "Auditable, reversible Codex session provider migrations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Codex Session Manager contributors" }]
dependencies = []

[project.scripts]
codex-session-manager = "codex_session_manager.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_session_manager = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

