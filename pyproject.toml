[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-transfer"
version = "0.5.0"
description = "Codex Transfer: auditable session moves and forks across providers and hosts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Codex Transfer contributors" }]
dependencies = []

[project.scripts]
codex-transfer = "codex_transfer.cli:main"
ct = "codex_transfer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_transfer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
